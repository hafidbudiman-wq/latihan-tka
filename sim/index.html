<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulasi TKA SD</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c:#7b3fbf;--cl:#efe6fb;--or:#f2a51d;--ok:#1f9d55;--ok2:#e3f7ea;--no:#d64545;--no2:#fde8e8;--ink:#1e2240;--mut:#6b6f87;--bg:#f7f5fc}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
a{color:var(--c)}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 110px}
.back{display:inline-block;margin-bottom:10px;font-weight:600;text-decoration:none}
.hero{background:linear-gradient(135deg,var(--c),var(--c2,#a05bd9));color:#fff;border-radius:22px;padding:24px 22px;position:relative;overflow:hidden}
.hero h1{margin:4px 0 6px;font-size:26px;line-height:1.2}
.hero p{margin:0;opacity:.92}
.hero .tag{display:inline-block;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.card{background:#fff;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 2px 10px rgba(60,30,120,.06)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--cl);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--c)}
.stat span{font-size:12px;color:var(--mut)}
label.inp{display:block;font-weight:600;margin:14px 0 6px}
input[type=text]{width:100%;padding:12px 14px;border:2px solid #ddd3f0;border-radius:12px;font:inherit}
.modes{display:grid;gap:10px;margin-top:8px}
.mode{display:flex;gap:12px;align-items:flex-start;border:2px solid #e6def5;border-radius:14px;padding:12px;background:#fff;text-align:left;font-size:15px;color:var(--ink)}
.mode.sel{border-color:var(--c);background:var(--cl)}
.mode .ic{font-size:26px}.mode b{display:block}.mode small{color:var(--mut)}
.btn{background:var(--c);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:16px}
.btn.big{width:100%;margin-top:16px;font-size:18px}
.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.btn.or{background:var(--or)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.top{position:sticky;top:0;z-index:5;background:rgba(247,245,252,.96);backdrop-filter:blur(6px);padding:10px 0 8px;border-bottom:1px solid #ebe4f6}
.topin{max-width:760px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:10px}
.prog{flex:1;height:10px;background:#e6def5;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
.timer{font-weight:700;font-variant-numeric:tabular-nums;background:#fff;border-radius:10px;padding:4px 10px;font-size:15px}
.timer.warn{color:var(--no)}
.icon-btn{background:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:18px}
.sec{margin-top:18px;font-weight:800;font-size:14px;color:var(--c);letter-spacing:.3px}
.bacaan{background:#fffdf5;border:2px solid #f0e2b8;border-radius:16px;padding:14px 16px;margin-top:12px;font-size:15.5px}
.bacaan .lbl{font-size:13px;font-weight:700;color:#b07000;margin-bottom:6px}
.bacaan h4{margin:0 0 8px;text-align:center;font-size:17px}
.bacaan p{margin:0 0 8px;text-indent:24px}
.bacaan p.ni{text-indent:0}
.bacaan .puisi{white-space:pre-line;text-align:center;font-style:italic;text-indent:0}
.bacaan .src{font-size:12px;color:var(--mut);text-indent:0}
.bacaan table{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
.bacaan td,.bacaan th{border:1px solid #eadfc0;padding:6px 8px;text-align:left;vertical-align:top}
.toggle-baca{background:none;border:0;color:#b07000;font-weight:700;font-size:13px;padding:0;margin-top:4px}
.q{border:3px solid var(--c);border-radius:20px;background:#fff;padding:16px;margin-top:14px}
.qh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.num{background:var(--c);color:#fff;font-weight:800;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;font-size:18px}
.qt{font-weight:700;color:var(--c)}
.qs{color:var(--mut);font-size:14px}
.qtext p{margin:0 0 10px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;line-height:1.1;margin:0 2px}
.fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:center;border:2px solid #e3ddef;border-radius:14px;padding:11px 12px;background:#fff;text-align:left;font-size:16px;color:var(--ink);width:100%}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;background:#f1edf9;color:var(--c)}
.opt.cb .k{border-radius:7px}
.opt.sel{border-color:var(--c);background:var(--cl)}.opt.sel .k{background:var(--c);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok2)}.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no2)}.opt.wrong .k{background:var(--no);color:#fff}
.hint{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;background:var(--cl);color:var(--c);border-radius:99px;padding:3px 12px;margin-top:4px}
.bs{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:6px}
.bs th{font-size:13px;color:var(--mut);text-align:left;padding:0 6px}
.bs th.c{text-align:center;width:70px}
.bs td{background:#faf8fd;padding:10px 8px;vertical-align:middle}
.bs td:first-child{border-radius:12px 0 0 12px;font-weight:700;color:var(--c);width:28px;text-align:center}
.bs td:last-child{border-radius:0 12px 12px 0}
.bs td.c{text-align:center}
.pill{border:2px solid #d9d1ea;background:#fff;border-radius:10px;padding:6px 0;width:62px;font-weight:700;font-size:12px;color:var(--mut)}
.pill.sel{background:var(--c);border-color:var(--c);color:#fff}
.pill.right{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.wrong{background:var(--no);border-color:var(--no);color:#fff}
.pill.miss{border-color:var(--ok);color:var(--ok);border-style:dashed}
.fig{display:flex;justify-content:center;margin:10px 0}
.fig svg{max-width:100%;height:auto}
table.data{border-collapse:collapse;margin:8px auto;font-size:15px}
table.data th{background:var(--c);color:#fff;padding:7px 12px}
table.data td{padding:6px 12px;text-align:center;border-bottom:1px solid #eee}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1}
.res{margin-top:14px;border-radius:14px;padding:14px}
.res.ok{background:var(--ok2);border:2px solid var(--ok)}
.res.no{background:var(--no2);border:2px solid var(--no)}
.res h4{margin:0 0 6px;font-size:17px}
.res .bh{background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px}
.res .bh ul{margin:4px 0;padding-left:20px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ebe4f6;padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navin{max-width:760px;margin:0 auto;display:flex;gap:10px}
.navin .btn{flex:1;padding:12px}
.navgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.nb{border:2px solid #e3ddef;background:#fff;border-radius:10px;padding:8px 0;font-weight:700;color:var(--mut)}
.nb.ans{background:var(--cl);border-color:var(--c);color:var(--c)}
.nb.cur{outline:3px solid var(--or);outline-offset:1px}
.nb.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.nb.no{background:var(--no);border-color:var(--no);color:#fff}
.modal{position:fixed;inset:0;background:rgba(30,20,60,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 6px}
.score{font-size:64px;font-weight:800;color:var(--c);text-align:center;line-height:1;margin:10px 0}
.badge{text-align:center;font-size:44px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.row span:first-child{width:150px}
.row .bar{flex:1;height:12px;background:#eee;border-radius:99px;overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--c)}
.hidden{display:none!important}
.small{font-size:13px;color:var(--mut)}
.err{padding:40px 20px;text-align:center}
</style>
</head>
<body>
<div id="home" class="wrap"></div>
<div id="quiz" class="hidden">
  <div class="top"><div class="topin">
    <button class="icon-btn" id="btnGrid" aria-label="Daftar soal">☰</button>
    <div class="prog"><i id="progBar"></i></div>
    <span class="small" id="progTxt"></span>
    <span class="timer hidden" id="timer"></span>
  </div></div>
  <div class="wrap" id="qwrap"></div>
  <div class="nav"><div class="navin"><button class="btn ghost" id="prev">← Sebelumnya</button><button class="btn" id="next">Berikutnya →</button></div></div>
</div>
<div id="result" class="wrap hidden"></div>
<div class="modal" id="gridModal"><div class="sheet"><h3>Daftar Soal</h3><div class="small">Berwarna = sudah dijawab · Kotak oranye = soal sekarang</div><div class="navgrid" id="navgrid"></div>
  <div class="actions"><button class="btn ghost" id="closeGrid">Tutup</button><button class="btn or" id="finishBtn">Selesai & Lihat Nilai</button></div></div></div>
<div class="modal" id="confModal"><div class="sheet"><h3>Yakin sudah selesai?</h3><p id="confTxt"></p>
  <div class="actions"><button class="btn ghost" id="confNo">Cek lagi</button><button class="btn or" id="confYes">Ya, selesai</button></div></div></div>

<script>
/* ===== helper untuk file data paket ===== */
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const M=(w,a,b)=>`${w}${F(a,b)}`;
function BAR(labels,vals,opt={}){const max=opt.max||Math.ceil(Math.max(...vals)/10)*10,step=opt.step||(max/5),w=opt.w||320,h=opt.h||190,pl=36,pb=26,pt=18,ch=h-pb-pt,cw=(w-pl-8)/labels.length;
 const C=opt.colors||['#2f6fe0','#f2a51d','#22a06b','#e8582a','#7b3fbf','#d64545','#0aa3b5'];let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" font-family="Poppins" font-size="11">`;
 for(let v=0;v<=max+1e-9;v+=step){const y=pt+ch-ch*v/max;s+=`<line x1="${pl}" y1="${y}" x2="${w-6}" y2="${y}" stroke="#e5e5ee"/><text x="${pl-6}" y="${y+4}" text-anchor="end" fill="#6b6f87">${+v.toFixed(2)}</text>`}
 labels.forEach((l,i)=>{const bh=ch*vals[i]/max,x=pl+i*cw+cw*.2,bw=cw*.6,y=pt+ch-bh;s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${C[i%C.length]}"/>${opt.noVal?'':`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-weight="700">${vals[i]}</text>`}<text x="${x+bw/2}" y="${h-8}" text-anchor="middle">${l}</text>`});
 if(opt.unit)s+=`<text x="4" y="12" fill="#6b6f87">${opt.unit}</text>`;return s+'</svg>'}
function CUBES(h,opt={}){/* h: {"col,row":tinggi}, row 0 = depan */const s=opt.s||36,d=s/2,cols=Math.max(...Object.keys(h).map(k=>+k.split(',')[0]))+1,rows=Math.max(...Object.keys(h).map(k=>+k.split(',')[1]))+1,maxh=Math.max(...Object.values(h));
 const W=cols*s+rows*d+30,H=maxh*s+rows*d+30,bx=10,by=H-12;let o=`<svg viewBox="0 0 ${W} ${H}" width="${Math.min(W*1.1,300)}">`;
 const cube=(x,y)=>`<polygon points="${x},${y} ${x+d},${y-d} ${x+s+d},${y-d} ${x+s},${y}" fill="#dcc6f5" stroke="#1e2a5a" stroke-width="2" stroke-linejoin="round"/><polygon points="${x+s},${y} ${x+s+d},${y-d} ${x+s+d},${y+s-d} ${x+s},${y+s}" fill="#7c4fb6" stroke="#1e2a5a" stroke-width="2" stroke-linejoin="round"/><rect x="${x}" y="${y}" width="${s}" height="${s}" fill="#b48ee0" stroke="#1e2a5a" stroke-width="2"/>`;
 for(let r=rows-1;r>=0;r--)for(let c=0;c<cols;c++){const n=h[c+','+r]||0;for(let l=0;l<n;l++)o+=cube(bx+c*s+r*d,by-s-l*s-r*d)}return o+'</svg>'}

/* ===== muat data paket ===== */
const pid=(new URLSearchParams(location.search).get('p')||'').toLowerCase();
const $=id=>document.getElementById(id);
if(!/^[a-z0-9-]+$/.test(pid)){$('home').innerHTML='<div class="err">Paket tidak ditemukan. <a href="../index.html">Kembali</a></div>'}
else{const sc=document.createElement('script');sc.src='data/'+pid+'.js';sc.onload=init;sc.onerror=()=>{$('home').innerHTML='<div class="err">Paket tidak ditemukan. <a href="../index.html">Kembali</a></div>'};document.head.appendChild(sc)}

const TYPE={pg:'Pilihan Ganda',pgk:'Pilihan Ganda Kompleks',bs:'Benar / Salah'};
let P,Q,mode='latihan',cur=0,ans,checked,done=false,tLeft,tInt=null,nama='';
function init(){
  P=PAKET;Q=P.soal;if(P.acak)Q.forEach((q,i)=>{if(q.t!=='pg'||q.figOpt)return;let h=2166136261;for(const ch of P.id+i)h=Math.imul(h^ch.charCodeAt(0),16777619);const r=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000};const ix=q.o.map((_,j)=>j);for(let j=ix.length-1;j>0;j--){const k=Math.floor(r()*(j+1));[ix[j],ix[k]]=[ix[k],ix[j]]}q.o=ix.map(j=>q.o[j]);q.ans=ix.indexOf(q.ans)});document.title=P.judul+' – Simulasi TKA SD';
  document.documentElement.style.setProperty('--c',P.warna[0]);document.documentElement.style.setProperty('--c2',P.warna[1]);document.documentElement.style.setProperty('--cl',P.warna[2]);
  ans=Q.map(blank);checked=Q.map(()=>false);tLeft=P.waktu*60;
  const bentuk=[...new Set(Q.map(q=>q.t))].map(t=>TYPE[t]);
  $('home').innerHTML=`<a class="back" href="../index.html#${P.mapel==='Bahasa Indonesia'?'bahasa-indonesia':'matematika'}">← Semua latihan</a>
  <div class="hero"><span class="tag">Simulasi TKA · ${P.mapel} · Kelas 6 SD</span><h1>${P.judul}</h1><p>${P.ket||''}</p></div>
  <div class="card"><div class="grid3"><div class="stat"><b>${Q.length}</b><span>Butir soal</span></div><div class="stat"><b>${P.waktu}'</b><span>Menit</span></div><div class="stat"><b>${bentuk.length}</b><span>Bentuk soal</span></div></div>
  <label class="inp" for="nama">Nama kamu</label><input id="nama" type="text" placeholder="Tulis namamu di sini">
  <label class="inp">Pilih mode</label><div class="modes">
   <button class="mode sel" data-mode="latihan"><span class="ic">📘</span><span><b>Mode Latihan</b><small>Cek jawaban tiap soal dan langsung lihat pembahasannya. Tanpa batas waktu.</small></span></button>
   <button class="mode" data-mode="ujian"><span class="ic">⏱️</span><span><b>Mode Simulasi Ujian</b><small>${P.waktu} menit seperti TKA asli. Nilai dan pembahasan muncul setelah selesai.</small></span></button></div>
  <button class="btn big" id="mulai">Mulai Mengerjakan →</button>
  <p class="small" style="margin-top:14px">Bentuk soal: ${bentuk.join(', ')}. Satu soal dihitung benar kalau semua bagiannya benar.</p></div>
  <div class="card"><b>Materi</b><div class="small" style="margin-top:6px">${P.bagian.map((b,i)=>{const ix=Q.map((q,j)=>q.b===i?j+1:0).filter(Boolean);return `• Bagian ${i+1} · ${b} (soal ${ix[0]}–${ix[ix.length-1]})`}).join('<br>')}</div></div>`;
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');mode=b.dataset.mode});
  $('mulai').onclick=()=>{nama=$('nama').value.trim();$('home').classList.add('hidden');$('quiz').classList.remove('hidden');if(mode==='ujian'){$('timer').classList.remove('hidden');tick(1);tInt=setInterval(tick,1000)}render();scrollTo(0,0)};
}
const blank=q=>q.t==='pg'?null:q.t==='pgk'?[]:q.o.map(()=>null);
function tick(first){if(!first)tLeft--;const m=Math.floor(tLeft/60),s=tLeft%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;$('timer').classList.toggle('warn',tLeft<=300);if(tLeft<=0)finish()}
function answered(i){const a=ans[i],t=Q[i].t;return t==='pg'?a!==null:t==='pgk'?a.length>0:a.every(x=>x!==null)}
function isCorrect(i){const q=Q[i],a=ans[i];if(q.t==='pg')return a===q.ans;if(q.t==='pgk')return [...a].sort().join()===[...q.ans].sort().join();return a.every((x,j)=>x===q.ans[j])}
const reveal=i=>done||(mode==='latihan'&&checked[i]);
const lbl=q=>q.label||['Benar','Salah'];
let bacaOpen={};

function render(){
  const q=Q[cur],rv=reveal(cur);let h='';
  if(cur===0||Q[cur-1].b!==q.b)h+=`<div class="sec">BAGIAN ${q.b+1} · ${P.bagian[q.b].toUpperCase()}</div>`;
  if(q.teks){const tx=P.teks[q.teks];const first=Q.findIndex(x=>x.teks===q.teks),last=Q.length-1-[...Q].reverse().findIndex(x=>x.teks===q.teks);
    const open=bacaOpen[q.teks+cur]!==undefined?bacaOpen[q.teks+cur]:true;
    h+=`<div class="bacaan"><div class="lbl">📖 ${first===last?`Bacalah teks berikut untuk soal nomor ${first+1}!`:`Bacalah teks berikut untuk soal nomor ${first+1}–${last+1}!`}</div>${open?tx:''}<button class="toggle-baca" id="tgB">${open?'▲ Sembunyikan bacaan':'▼ Tampilkan bacaan'}</button></div>`}
  h+=`<div class="q"><div class="qh"><div class="num">${cur+1}</div><div><div class="qt">${q.t==='bs'&&q.label?q.label.join(' / '):TYPE[q.t]}</div><div class="qs">${q.sub||''}</div></div></div><div class="qtext">${q.q}</div>`;
  if(q.fig)h+=`<div class="fig">${q.fig}</div>`;
  if(q.t==='pg'){h+='<div class="opts">';q.o.forEach((o,j)=>{let c='opt';if(ans[cur]===j)c+=' sel';if(rv){if(j===q.ans)c+=' right';else if(ans[cur]===j)c+=' wrong'}
    h+=`<button class="${c}" data-j="${j}" ${rv?'disabled':''}><span class="k">${'ABCD'[j]}</span><span style="flex:1;overflow:auto">${o}</span></button>`});h+='</div>'}
  else if(q.t==='pgk'){h+=`<span class="hint">✓ Jawaban benar lebih dari satu</span><div class="opts">`;q.o.forEach((o,j)=>{const on=ans[cur].includes(j),ok=q.ans.includes(j);let c='opt cb';if(on)c+=' sel';if(rv){if(ok)c+=' right';else if(on)c+=' wrong'}
    h+=`<button class="${c}" data-j="${j}" ${rv?'disabled':''}><span class="k">${on||(rv&&ok)?'✓':j+1}</span><span>${o}</span></button>`});h+='</div>'}
  else{const L=lbl(q);h+=`<p style="margin:6px 0 0;font-weight:600">Tentukan ${L[0]} atau ${L[1]} untuk setiap pernyataan!</p><table class="bs"><tr><th>No</th><th>Pernyataan</th><th class="c">${L[0]}</th><th class="c">${L[1]}</th></tr>`;
    q.o.forEach((o,j)=>{h+=`<tr><td>${j+1}</td><td>${o}</td>`;[true,false].forEach(v=>{let c='pill';const pick=ans[cur][j]===v;if(pick)c+=' sel';if(rv){if(q.ans[j]===v)c+=pick?' right':' miss';else if(pick)c+=' wrong'}
      h+=`<td class="c"><button class="${c}" data-j="${j}" data-v="${v}" ${rv?'disabled':''}>${v?L[0]:L[1]}</button></td>`});h+='</tr>'});h+='</table>'}
  if(mode==='latihan'&&!done&&!checked[cur])h+=`<div class="actions"><button class="btn or" id="cek" ${answered(cur)?'':'disabled'}>Cek Jawaban</button></div>`;
  if(rv){const ok=isCorrect(cur);h+=`<div class="res ${ok?'ok':'no'}"><h4>${ok?'🎉 Hebat, jawabanmu benar!':(answered(cur)?'😅 Belum tepat, ayo pelajari pembahasannya':'⚠️ Soal ini belum dijawab')}</h4><div><b>Kunci: </b>${keyText(cur)}</div><div class="bh"><b>Pembahasan</b><br>${q.bh}</div></div>`;
    if(mode==='latihan'&&!done)h+=`<div class="actions"><button class="btn ghost" id="ulang">↺ Coba lagi soal ini</button></div>`}
  h+='</div>';$('qwrap').innerHTML=h;
  $('qwrap').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(q.t==='pg')ans[cur]=j;else{const a=ans[cur],k=a.indexOf(j);k<0?a.push(j):a.splice(k,1)}render()});
  $('qwrap').querySelectorAll('.pill').forEach(b=>b.onclick=()=>{ans[cur][+b.dataset.j]=b.dataset.v==='true';render()});
  const tg=$('tgB');if(tg)tg.onclick=()=>{const k=q.teks+cur;bacaOpen[k]=!(bacaOpen[k]!==undefined?bacaOpen[k]:true);render()};
  const ck=$('cek');if(ck)ck.onclick=()=>{checked[cur]=true;render()};
  const ul=$('ulang');if(ul)ul.onclick=()=>{checked[cur]=false;ans[cur]=blank(q);render()};
  const n=Q.filter((_,i)=>answered(i)).length;$('progBar').style.width=(n/Q.length*100)+'%';$('progTxt').textContent=`${n}/${Q.length}`;
  $('prev').disabled=cur===0;$('next').textContent=cur===Q.length-1?(done?'Lihat Nilai':'Selesai ✓'):'Berikutnya →';
}
function keyText(i){const q=Q[i];if(q.t==='pg')return `${'ABCD'[q.ans]}${q.figOpt?'':'. '+q.o[q.ans]}`;if(q.t==='pgk')return 'Pernyataan nomor '+q.ans.map(x=>x+1).join(', ');const L=lbl(q);return q.ans.map((v,j)=>`(${j+1}) ${v?L[0]:L[1]}`).join(' · ')}
$('prev').onclick=()=>{if(cur>0){cur--;render();scrollTo(0,0)}};
$('next').onclick=()=>{if(cur<Q.length-1){cur++;render();scrollTo(0,0)}else if(done)showResult();else askFinish()};
$('btnGrid').onclick=()=>{drawGrid();$('gridModal').classList.add('show')};
$('closeGrid').onclick=()=>$('gridModal').classList.remove('show');
$('finishBtn').onclick=()=>{$('gridModal').classList.remove('show');done?showResult():askFinish()};
function drawGrid(){$('finishBtn').textContent=done?'Lihat Nilai':'Selesai & Lihat Nilai';$('navgrid').innerHTML=Q.map((_,i)=>{let c='nb';if(reveal(i))c+=isCorrect(i)?' ok':' no';else if(answered(i))c+=' ans';if(i===cur)c+=' cur';return `<button class="${c}" data-i="${i}">${i+1}</button>`}).join('');
  $('navgrid').querySelectorAll('.nb').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;$('gridModal').classList.remove('show');render();scrollTo(0,0)})}
function askFinish(){const k=Q.length-Q.filter((_,i)=>answered(i)).length;$('confTxt').textContent=k?`Masih ada ${k} soal yang belum dijawab. Soal kosong dihitung salah.`:'Semua soal sudah dijawab. Mau lihat nilainya sekarang?';$('confModal').classList.add('show')}
$('confNo').onclick=()=>$('confModal').classList.remove('show');
$('confYes').onclick=()=>{$('confModal').classList.remove('show');finish()};
function finish(){done=true;clearInterval(tInt);showResult()}
function showResult(){
  $('quiz').classList.add('hidden');$('result').classList.remove('hidden');scrollTo(0,0);
  const ok=Q.map((_,i)=>isCorrect(i)),b=ok.filter(Boolean).length,nilai=Math.round(b/Q.length*100);
  const per=P.bagian.map((nm,s)=>{const ix=Q.map((q,i)=>q.b===s?i:-1).filter(i=>i>=0);return {nm,tot:ix.length,ok:ix.filter(i=>ok[i]).length}});
  const em=nilai>=85?'🏆':nilai>=70?'🌟':nilai>=50?'💪':'📚';
  const msg=nilai>=85?'Luar biasa! Kamu sudah sangat siap.':nilai>=70?'Bagus! Tinggal rapikan beberapa materi lagi.':nilai>=50?'Lumayan! Pelajari pembahasan soal yang salah ya.':'Tetap semangat! Ulangi pakai Mode Latihan dan baca pembahasannya.';
  const used=mode==='ujian'?`<div class="small" style="text-align:center">Waktu terpakai: ${Math.floor((P.waktu*60-tLeft)/60)} menit ${(P.waktu*60-tLeft)%60} detik</div>`:'';
  $('result').innerHTML=`<div class="hero"><span class="tag">Hasil ${P.judul}</span><h1>${nama?nama+', ini':'Ini'} nilaimu!</h1><p>Simulasi TKA ${P.mapel} Kelas 6 SD</p></div>
  <div class="card"><div class="badge">${em}</div><div class="score">${nilai}</div><div style="text-align:center;font-weight:600">${b} dari ${Q.length} soal benar</div><p style="text-align:center;margin:6px 0">${msg}</p>${used}
  ${per.map(p=>`<div class="row"><span>${p.nm}</span><div class="bar"><i style="width:${p.ok/p.tot*100}%"></i></div><b>${p.ok}/${p.tot}</b></div>`).join('')}</div>
  <div class="card"><b>Tap nomor soal untuk lihat pembahasan</b><div class="small">Hijau = benar · Merah = salah/kosong</div><div class="navgrid">${Q.map((_,i)=>`<button class="nb ${ok[i]?'ok':'no'}" data-i="${i}">${i+1}</button>`).join('')}</div></div>
  <div class="card"><b>Kunci Jawaban</b><table class="data" style="width:100%;margin-top:8px;font-size:14px"><tr><th>No</th><th>Kunci</th><th></th></tr>${Q.map((q,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${keyText(i)}</td><td>${ok[i]?'✅':'❌'}</td></tr>`).join('')}</table></div>
  <div class="actions"><button class="btn ghost" id="toQ">Lihat Soal & Pembahasan</button><button class="btn" id="again">Ulangi dari Awal</button></div>`;
  $('result').querySelectorAll('.navgrid .nb').forEach(x=>x.onclick=()=>{cur=+x.dataset.i;backToQ()});
  $('toQ').onclick=()=>{cur=0;backToQ()};$('again').onclick=()=>location.reload();
}
function backToQ(){$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('timer').classList.add('hidden');render();scrollTo(0,0)}
</script>
</body>
</html>
